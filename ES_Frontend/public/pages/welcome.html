<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Σελίδα Υποδοχής</title>
</head>
<style>
  body 
  {
	background-color:lavender;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
  }

  .topnav 
  {
    margin-left: 30px;
    margin-right: 30px;
    overflow: hidden;
    background-color: slategray;
  }

  .topnav a 
  {
    float: left;
    color: #f2f2f2;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
    font-size: 17px;
  }

  .topnav a:hover 
  {
    background-color: rgb(80, 80, 80);
    color: rgb(255, 255, 255);
  }

  .loginbtn 
  {
    background-color: #008CBA;
    border: none;
    color: white;
    padding: 15px 32px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 16px;
    margin: 4px 2px;
    cursor: pointer;
	margin-left:45px;
  }
  
  h2
  {
	margin-left:25px;
  }
</style>

<body>
  <div class="logo">
    <img src="../images/logo.png">
  </div>
  <div class="topnav">
    <a href="/">Αρχική Σελίδα</a>
    <a href="/about">Πληροφορίες</a>
  </div>
  <div style="padding-left: 30px">
	<br/>
    <h2>Υπηρεσία διαχείρισης αιτήσεων φοιτητικής εστίας</h2>
	<br/>
    <button class="loginbtn" onclick="window.location.href='/login'">Είσοδος στην υπηρεσία</button>
  </div>
</body>

</html>
