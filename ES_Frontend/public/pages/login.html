<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Είσοδος στο Σύστημα</title>
</head>
<style>
    body 
	{
        font-family: Arial, Helvetica, sans-serif;
        background: lavender;
        margin: 0;
        padding: 0;
        background-size: cover;
    }
	
	.topnav 
	{
		margin-left: 30px;
		margin-right: 30px;
		overflow: hidden;
		background-color: slategray;
	}

    .topnav a 
	{
		float: left;
		color: #f2f2f2;
		text-align: center;
		padding: 14px 16px;
		text-decoration: none;
		font-size: 17px;
	}

    .topnav a:hover 
    {
		background-color: rgb(80, 80, 80);
	 	color: rgb(255, 255, 255);
    }

    .box 
	{
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 25rem;
        padding: 2.5rem;
        box-sizing: border-box;
        border: 1px solid #dadce0;
        background-color: white;
        -webkit-border-radius: 8px;
        border-radius: 8px;

    }

    .box h2 
	{
        margin: 0px 0 -0.125rem;
        padding: 0;
        color: #fff;
        text-align: center;
        color: #202124;
        font-family: 'Google Sans', 'Noto Sans Myanmar UI', arial, sans-serif;
        font-size: 24px;
        font-weight: 400;
        padding-bottom: 30px;
    }

    .box p 
	{
        font-size: 16px;
        font-weight: 400;
        letter-spacing: .1px;
        line-height: 1.5;
        margin-bottom: 25px;
        text-align: center;
    }

    .box .inputBox 
	{
        position: relative;
    }

    .box .inputBox input 
	{
        width: 93%;
        padding: 0.625rem 10px;
        font-size: 1rem;
        letter-spacing: 0.062rem;
        margin-bottom: 1.875rem;
        border: 1px solid #dadce0;
        background: transparent;
        border-radius: 4px;

    }

    .box .inputBox label 
	{
        position: absolute;
        top: 0;
        left: 10px;
        padding: 0.625rem 0;
        font-size: 1rem;
        color: grey;
        pointer-events: none;
        transition: 0.5s;
    }

    .box .inputBox input:focus~label,
    .box .inputBox input:valid~label,
    .box .inputBox input:not([value=""])~label 
	{
        top: -1.125rem;
        left: 10px;
        color: #1a73e8;
        font-size: 0.75rem;
        background-color: white;
        height: 10px;
        padding-left: 5px;
        padding-right: 5px;
    }

    .box .inputBox input:focus 
	{
        outline: none;
        border: 2px solid #1a73e8;
    }

    .btn 
	{
        background-color: #008CBA;
        border: none;
        color: white;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        margin-left: 100px;
    }
</style>



<body>
	<div class="logo">
		<img src="../images/logo.png">
	</div>
	
	<div class="topnav"> 
	    <a href="/">Αρχική Σελίδα</a>
		<a href="/about">Πληροφορίες</a>
	</div>
    <div>
       <h2 id="header"></h2>
    </div>
	 
    <div class="box">
        <h2>Είσοδος χρήστη</h2>
        <form method="POST" action="/login">
            <div class="inputBox">
                <input type="text" name="username" id="userName" required onkeyup="this.setAttribute('value', this.value);" value="">
                <label>Όνομα Χρήστη</label>
            </div>
            <div class="inputBox">
                <input type="password" name="password" id="passWord" required onkeyup="this.setAttribute('value', this.value);"
                    value="">
                <label>Κωδικός Πρόσβασης</label>
            </div>
            <input class="btn" type="submit" value="Είσοδος"/>
        </form>        
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const myParam = urlParams.get('error');
        if(myParam == "Incorrect_Credential") 
		{
            alert("Incorect username and password combination!");
        }
    </script>
</body>
</html>
